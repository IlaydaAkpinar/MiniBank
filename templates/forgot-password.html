<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniBank - Forgot Password</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body class="reset-password-body">

<main class="reset-page">

    <section class="reset-brand">

        <p class="visually-hidden">
            MiniBank password recovery
        </p>

        <span class="brand-mark">
            MB
        </span>

        <h1>
            Forgot your<br>
            password?
        </h1>

        <p>
            Reset your MiniBank password securely
            and regain access to your account.
        </p>

        <article class="reset-card-preview">

            <span class="reset-card-chip"></span>

            <p class="reset-card-number">
                •••• •••• •••• 4821
            </p>

            <p class="reset-card-meta">

                <span>
                    MINIBANK
                </span>

                <span>
                    SECURE
                </span>

            </p>

        </article>

    </section>


    <section class="reset-panel">

        <header class="reset-header">

            <p class="reset-eyebrow">
                ACCOUNT SECURITY
            </p>

            <h2>
                Forgot password?
            </h2>

            <p>
                Enter your email address to request a password reset.
            </p>

        </header>


        <form id="forgotPasswordForm">

            <fieldset>

                <section class="reset-field">

                    <label for="email">
                        Email address
                    </label>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                    >

                </section>


                <button
                        type="submit"
                        class="reset-button"
                        id="forgotPasswordButton"
                >
                    Request password reset
                </button>

            </fieldset>

        </form>


        <p
                id="message"
                class="reset-message"
                role="alert"
        ></p>


        <footer class="reset-footer">

            <a href="/">
                Back to login
            </a>

        </footer>

    </section>

</main>

<script src="/forgot-password.js"></script>

</body>

</html>
