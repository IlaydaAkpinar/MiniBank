<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniBank — Übersicht</title>

    <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
            rel="stylesheet"
    >

    <link rel="stylesheet" href="/style.css">
    <script src="/dashboard.js" defer></script>
</head>

<body>

<main class="page">

    <section class="login-panel">

        <header class="login-header">
            <h1>Ihre Übersicht</h1>

            <p>
                Willkommen bei MiniBank.
            </p>
        </header>


        <section>
            <h2>Konto</h2>

            <p>
                Kontonummer:
                <strong id="accountNumber">Wird geladen...</strong>
            </p>

            <p>
                Kontostand:
                <strong id="balance">Wird geladen...</strong>
            </p>
        </section>


        <section>
            <h2>Geld senden</h2>

            <form id="transactionForm">

                <p class="field">
                    <label for="toAccount">
                        Zielkonto
                    </label>

                    <input
                            type="number"
                            id="toAccount"
                            name="toAccount"
                            required
                    >
                </p>

                <p class="field">
                    <label for="amount">
                        Betrag
                    </label>

                    <input
                            type="number"
                            id="amount"
                            name="amount"
                            min="0.01"
                            step="0.01"
                            required
                    >
                </p>

                <p
                        id="transactionError"
                        class="login-error"
                        hidden
                ></p>

                <p
                        id="transactionSuccess"
                        class="login-success"
                        hidden
                ></p>

                <button type="submit">
                    Geld senden
                </button>

            </form>
        </section>


        <section>
            <h2>Transaktionsverlauf</h2>

            <p id="transactionStatus">
                Transaktionen werden geladen...
            </p>

            <ul id="transactionList"></ul>
        </section>


        <footer>
            <button
                    type="button"
                    id="logoutButton"
            >
                Abmelden
            </button>
        </footer>

    </section>

</main>

</body>

</html>
