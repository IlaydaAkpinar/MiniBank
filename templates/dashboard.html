<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniBank - Dashboard</title>

    <!-- Google Fonts: Fraunces for display headings, Inter for body text, IBM Plex Mono for account/number styling -->
    <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
            rel="stylesheet"
    >

    <link rel="stylesheet" href="/style.css">
    <!-- defer ensures the DOM is fully parsed before dashboard.js runs -->
    <script src="/dashboard.js" defer></script>
</head>

<body>

<main class="page">

    <section class="login-panel">

        <header class="login-header">
            <h1>Your Dashboard</h1>

            <p>
                Welcome to MiniBank.
            </p>
        </header>


        <!-- Account overview: values are populated dynamically via JS (placeholder text shown while loading) -->
        <section>
            <h2>Account</h2>

            <p>
                Account number:
                <strong id="accountNumber">Loading...</strong>
            </p>

            <p>
                Balance:
                <strong id="balance">Loading...</strong>
            </p>
        </section>


        <!-- Money transfer form: submits to backend via JS (fetch), validated client- and server-side -->
        <section>
            <h2>Send Money</h2>

            <form id="transactionForm">

                <p class="field">
                    <label for="toAccount">
                        Target account
                    </label>

                    <input
                            type="number"
                            id="toAccount"
                            name="toAccount"
                            required
                    >
                </p>

                <p class="field">
                    <label for="amount">
                        Amount
                    </label>

                    <!-- min/step restrict input to positive values with cent precision -->
                    <input
                            type="number"
                            id="amount"
                            name="amount"
                            min="0.01"
                            step="0.01"
                            required
                    >
                </p>

                <!-- Feedback messages: hidden by default, toggled visible by JS depending on request outcome -->
                <p
                        id="transactionError"
                        class="login-error"
                        hidden
                ></p>

                <p
                        id="transactionSuccess"
                        class="login-success"
                        hidden
                ></p>

                <button type="submit">
                    Send money
                </button>

            </form>
        </section>


        <!-- Transaction history: list populated asynchronously; status message shown while fetching -->
        <section>
            <h2>Transaction History</h2>

            <p id="transactionStatus">
                Loading transactions...
            </p>

            <ul id="transactionList"></ul>
        </section>


        <!-- Logout triggers session/token cleanup and redirect, handled in dashboard.js -->
        <footer>
            <button
                    type="button"
                    id="logoutButton"
            >
                Log out
            </button>
        </footer>

    </section>

</main>

</body>

</html>
