<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <title>MiniBank - Dashboard</title>

    <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
            rel="stylesheet"
    >

    <link rel="stylesheet" href="/style.css">
    <script src="/dashboard.js" defer></script>
   

</head>

<body class="dashboard-body">

<div class="dashboard">

  
    <!-- =====================================================
         TOP NAVIGATION
         ===================================================== -->

    <header class="dashboard-nav">

        <div class="dashboard-brand">
            <div class="dashboard-brand-mark">MB</div>

            <div>
                <strong>MiniBank</strong>
                <span>Online Banking</span>
            </div>
        </div>

        <div class="dashboard-user">
            <span>Personal Banking</span>

            <button
                    type="button"
                    id="logoutButton"
                    class="logout-button"
            >
                Log out
            </button>
        </div>

    </header>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="dashboard-content">

        <header class="dashboard-welcome">
            <div>
                <p class="dashboard-eyebrow">
                    ACCOUNT OVERVIEW
                </p>

                <h1>Your Dashboard</h1>

                <p>
                    Welcome to MiniBank.
                </p>
            </div>
        </header>


        <!-- =================================================
             ACCOUNT OVERVIEW
             ================================================= -->

        <section class="dashboard-grid">

            <article class="balance-card">

                <div class="balance-card-top">

                    <div>
                        <p class="card-label">
                            Available balance
                        </p>

                        <p
                                id="balance"
                                class="balance-value"
                        >
                            Loading...
                        </p>
                    </div>

                    <div class="balance-icon">
                        €
                    </div>

                </div>

                <div class="balance-card-bottom">

                    <div>
                    <span class="account-label">
                        Account number
                    </span>

                        <strong
                                id="accountNumber"
                                class="account-number"
                        >
                            Loading...
                        </strong>
                    </div>

                    <span class="account-status">
                    Active
                </span>

                </div>

            </article>


            <!-- =================================================
                 SEND MONEY
                 ================================================= -->

            <article class="transfer-card">

                <div class="section-heading">

                    <div>
                        <p class="section-eyebrow">
                            PAYMENTS
                        </p>

                        <h2>Send money</h2>
                    </div>

                </div>


                <form id="transactionForm">

                    <div class="field">

                        <label for="toAccount">
                            Target account
                        </label>

                        <input
                                type="number"
                                id="toAccount"
                                name="toAccount"
                                placeholder="Account ID"
                                min="1"
                                required
                        >

                    </div>


                    <div class="field">

                        <label for="amount">
                            Amount
                        </label>

                        <div class="amount-input">

                            <span>€</span>

                            <input
                                    type="number"
                                    id="amount"
                                    name="amount"
                                    placeholder="0.00"
                                    min="0.01"
                                    step="0.01"
                                    required
                            >

                        </div>

                    </div>


                    <p
                            id="transactionError"
                            class="transaction-message transaction-error"
                            hidden
                    ></p>


                    <p
                            id="transactionSuccess"
                            class="transaction-message transaction-success"
                            hidden
                    ></p>


                    <button
                            type="submit"
                            class="transfer-button"
                    >
                        Send money
                    </button>

                </form>

            </article>

        </section>


        <!-- =================================================
             TRANSACTION HISTORY
             ================================================= -->

        <section class="transactions-card">

            <div class="transactions-header">

                <div>
                    <p class="section-eyebrow">
                        ACCOUNT ACTIVITY
                    </p>

                    <h2>Transaction history</h2>
                </div>

            </div>


            <div class="transaction-content">

                <p
                        id="transactionStatus"
                        class="transaction-status"
                >
                    Loading transactions...
                </p>

                <ul
                        id="transactionList"
                        class="transaction-list"
                ></ul>

            </div>

        </section>

    </main>
  

</div>

</body>
</html>
