<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniBank - Login</title>

    <!-- Preconnect hints speed up font loading by establishing the connection early -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fraunces for display headings, Inter for body text, IBM Plex Mono for the card number -->
    <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
            rel="stylesheet"
    >

    <link rel="stylesheet" href="/style.css">
    <!-- defer ensures the DOM is fully parsed before login.js runs -->
    <script src="/login.js" defer></script>
</head>

<body>

<main class="page">

    <!-- Left brand panel: purely decorative/marketing, no functional JS hooks here -->
    <aside class="brand">

        <p class="brand-mark">MB</p>

        <h1 class="brand-headline">
            See clearly,<br>
            decide calmly.
        </h1>

        <p class="brand-copy">
            Your account, your overview, available anytime.
        </p>

        <!-- Mock bank card visual for branding purposes; not tied to any real account data -->
        <figure class="card-preview">

            <!-- Screen-reader-only caption clarifying this is just a visual example -->
            <figcaption class="visually-hidden">
                Example MiniBank test card
            </figcaption>

            <span class="card-chip" aria-hidden="true"></span>

            <p class="card-label">
                TEST CARD
            </p>

            <!-- Non-breaking spaces keep the card number grouped together on line wraps -->
            <p class="card-number">
                4921&nbsp;6384&nbsp;1750&nbsp;2604
            </p>

            <p class="card-meta">
                <span class="card-holder">
                    M. SAMPLE
                </span>

                <span class="card-expiry">
                    09/29
                </span>
            </p>

            <p class="card-brand">
                MiniBank
            </p>

        </figure>

    </aside>

    <!-- Right panel: actual login form and logic -->
    <section class="login-panel">

        <header class="login-header">
            <h2>Welcome back</h2>

            <p>
                Sign in with your credentials.
            </p>
        </header>

        <form id="loginForm">

            <fieldset>

                <!-- Visually hidden legend gives screen readers context without cluttering the UI -->
                <legend class="visually-hidden">
                    Login credentials
                </legend>

                <p class="field">

                    <label for="username">
                        Username
                    </label>

                    <input
                            type="text"
                            id="username"
                            name="username"
                            autocomplete="username"
                            required
                    >

                </p>

                <p class="field">

                    <label for="password">
                        Password
                    </label>

                    <!-- Wrapper positions the show/hide toggle button inside the input -->
                    <span class="password-field">

                        <input
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                required
                        >

                        <!--
                            Show/hide password toggle.
                            aria-label and aria-pressed are kept in sync by login.js
                            to reflect the current visibility state for assistive tech.
                        -->
                        <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Show password"
                                aria-pressed="false"
                        >
                            <svg
                                    class="eye-icon"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                            >
                                <path
                                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                ></path>

                                <circle
                                        cx="12"
                                        cy="12"
                                        r="2.5"
                                ></circle>
                            </svg>
                        </button>

                    </span>

                </p>

            </fieldset>

            <p class="field-hint">
                <a href="/forgot-password">
                    Forgot password?
                </a>
            </p>

            <!-- Hidden by default; login.js reveals this with a message on failed sign-in -->
            <p
                    id="loginError"
                    class="login-error"
                    hidden
            ></p>

            <button type="submit">
                Sign in
            </button>

        </form>

        <footer>
            New to MiniBank?
            <a href="/register">Open an account</a>
        </footer>

    </section>

</main>

</body>
</html>
